version: "3.9"

services:
  # ── Gateway (API + UI statique) ───────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-ssh-gateway:2.0
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      DATABASE_URL:      postgresql+asyncpg://gateway:${DB_PASSWORD}@postgres:5432/mcp_ssh
      JWT_SECRET:        ${JWT_SECRET}
      JWT_EXPIRE_HOURS:  ${JWT_EXPIRE_HOURS:-24}
      ALLOW_DEFAULT_USERS: ${ALLOW_DEFAULT_USERS:-false}
      SSH_MODE:          ${SSH_MODE:-key}
      SSH_HOST_KEY_POLICY: ${SSH_HOST_KEY_POLICY:-tofu}
      SSH_KEY_PATH:      /run/secrets/ssh_key
      VAULT_URL:         ${VAULT_URL:-http://vault:8200}
      VAULT_TOKEN:       ${VAULT_TOKEN:-dev-only-token}
      VAULT_MOUNT:       ${VAULT_MOUNT:-ssh}
      VAULT_KV_MOUNT:    ${VAULT_KV_MOUNT:-secret}
      VAULT_KV_PATH:     ${VAULT_KV_PATH:-mcp-gateway/ssh-key}
      POLICY_PROD_DEFAULT: ${POLICY_PROD_DEFAULT:-deny}
      CORS_ORIGINS:      ${CORS_ORIGINS:-}
      RATE_PROD:         ${RATE_PROD:-10}
      RATE_STG:          ${RATE_STG:-30}
      RATE_DEV:          ${RATE_DEV:-100}
      LOG_LEVEL:         ${LOG_LEVEL:-info}
      REDIS_URL:         redis://redis:6379
      WEB_CONCURRENCY:   ${WEB_CONCURRENCY:-4}
    volumes:
      - ~/.ssh/id_rsa:/run/secrets/ssh_key:ro   # clé SSH locale en mode dev
      - gateway_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks: [mcp_net]

  # ── Nginx reverse proxy (UI → gateway) ───────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    networks: [mcp_net]

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       mcp_ssh
      POSTGRES_USER:     gateway
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [mcp_net]

  # ── Redis (rate limiting distribué + cache) ───────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 320M
    networks: [mcp_net]

  # ── Vault (server mode avec persistance fichier) ──────────────────────────
  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"   # loopback uniquement — jamais exposé sur le LAN
    environment:
      VAULT_STABLE_TOKEN: ${VAULT_TOKEN:-dev-only-token}
    volumes:
      - vault_data:/vault/data
      - vault_init:/vault/init   # clé d'unseal séparée des données chiffrées
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - ./vault/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -s http://localhost:8200/v1/sys/health | grep -q 'sealed.*false'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [mcp_net]

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks: [mcp_net]

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "http://localhost:${GRAFANA_PORT:-3001}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    networks: [mcp_net]

volumes:
  pgdata:
  gateway_data:
  vault_data:
  vault_init:
  prom_data:
  grafana_data:

networks:
  mcp_net:
    driver: bridge
