# Rate limiting zone — 10 MB shared memory, 20 req/s per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Persistent upstream connections to avoid TCP handshake overhead per request
upstream gateway_backend {
    server gateway:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # UI statique + SPA fallback
    location / {
        proxy_pass         http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";   # required for keepalive
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # API gateway with rate limiting (burst=50 allows short spikes)
    location /api/ {
        limit_req  zone=api burst=50 nodelay;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
