# Rate limiting zone — 10 MB shared memory, 20 req/s per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Docker embedded DNS — resolves hostnames at request time, not at startup
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    # En production, servir en HTTPS (listen 443 ssl + certificats) et activer :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # UI statique + SPA fallback
    location / {
        set $backend "http://gateway:8080";
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # API gateway with rate limiting (burst=50 allows short spikes)
    location /api/ {
        limit_req  zone=api burst=50 nodelay;
        set $backend "http://gateway:8080";
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
