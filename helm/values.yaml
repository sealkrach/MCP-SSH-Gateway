replicaCount: 2

image:
  repository: mcp-ssh-gateway
  tag: "2.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: mcp-ssh.internal
  tls: true

# Utilisateurs du gateway (JSON, hash bcrypt via `python -m gateway.hash_password`).
# REQUIS pour pouvoir se connecter : sans lui, aucun compte n'existe
# (les comptes de démo sont désactivés par défaut).
# Ex: '[{"username":"admin","password_hash":"$2b$12$...","roles":["admin"]}]'
gatewayUsers: ""

env:
  JWT_SECRET: ""           # Required — injecté via le Secret (jamais en env direct)
  JWT_EXPIRE_HOURS: "24"
  SSH_MODE: key            # key | vault | vault-kv | cyberark
  SSH_HOST_KEY_POLICY: strict   # strict | tofu | insecure
  POLICY_PROD_DEFAULT: deny     # deny = allow-list en production
  SSH_KEY_PATH: /run/secrets/ssh_key
  VAULT_URL: ""
  VAULT_TOKEN: ""
  VAULT_MOUNT: ssh
  RATE_PROD: "10"
  RATE_STG: "30"
  RATE_DEV: "100"
  LOG_LEVEL: info

database:
  host: postgres
  port: 5432
  name: mcp_ssh
  user: gateway
  password: ""             # Required — override in secret

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
