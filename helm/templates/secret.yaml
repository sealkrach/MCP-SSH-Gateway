apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
stringData:
  jwt_secret: {{ .Values.env.JWT_SECRET | required "JWT_SECRET requis" | quote }}
  db_password: {{ .Values.database.password | required "database.password requis" | quote }}
  {{- if .Values.gatewayUsers }}
  gateway_users: {{ .Values.gatewayUsers | quote }}
  {{- end }}
