apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app: mcp-ssh-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: mcp-ssh-gateway
  template:
    metadata:
      labels:
        app: mcp-ssh-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: db_password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: jwt_secret
            {{- if .Values.gatewayUsers }}
            - name: GATEWAY_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: gateway_users
            {{- end }}
            {{- range $k, $v := .Values.env }}
            {{- /* JWT_SECRET vient du Secret ci-dessus ; les valeurs vides sont ignorées */}}
            {{- if and (ne $k "JWT_SECRET") $v }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: ssh-key
              mountPath: /run/secrets/ssh_key
              subPath: id_rsa
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: ssh-key
          secret:
            secretName: {{ .Release.Name }}-ssh-key
            defaultMode: 0400
